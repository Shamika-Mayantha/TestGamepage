<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#151a3a">
<title>Who's On My Forehead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a game-night table. Dark ink-blue felt, yellow sticky notes as the hero object,
   one phone-width column, chat in a bottom sheet. Single deliberate dark look. */
:root {
  --felt: #151a3a;
  --felt-2: #1d2350;
  --card: #232a5c;
  --card-2: #2b336b;
  --line: #3a437f;
  --ink: #f1f3ff;
  --muted: #a8afd9;
  --note: #ffe14d;
  --note-shade: #f2cc22;
  --note-ink: #2b2508;
  --accent: #ff7a59;
  --accent-ink: #2a0d05;
  --yes: #39d98a;
  --yes-ink: #052b18;
  --no: #ff5c7a;
  --no-ink: #330812;
  --team: #b48cff;
  --f-display: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--felt); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background:
    radial-gradient(1200px 600px at 50% -200px, var(--felt-2), transparent 70%),
    var(--felt);
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
p { margin: 0; }
h2 { margin: 0; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--f-display); font-size: 1.35rem; line-height: 1; display: flex; align-items: center; gap: 8px; }
.brand .mini { width: 26px; height: 22px; background: var(--note); transform: rotate(-6deg); display: inline-block; border-radius: 2px; box-shadow: 0 3px 6px rgba(0,0,0,.35); }
.me { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; padding: 4px; cursor: pointer; min-height: 0; }
.conn { width: 8px; height: 8px; border-radius: 50%; background: var(--yes); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yes) 25%, transparent); }
.conn.off { background: var(--no); box-shadow: 0 0 0 3px color-mix(in srgb, var(--no) 25%, transparent); }

/* avatars */
.av { --c: var(--accent); width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #17122e; font-weight: 700; display: grid; place-items: center; flex: none; position: relative; font-size: 1rem; }
.av.sm { width: 26px; height: 26px; font-size: .75rem; }
.av.lg { width: 64px; height: 64px; font-size: 1.5rem; }
.av .st { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); border: 2.5px solid var(--card); }
.av.lg .st { width: 17px; height: 17px; }
.av.on .st { background: var(--yes); }
.av.away { filter: grayscale(.8) brightness(.7); }

/* panels and controls */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.flat { background: transparent; border-style: dashed; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: .92rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row > input { flex: 1 1 160px; min-width: 0; }
.spread { justify-content: space-between; }
input[type=text] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--felt); border: 1.5px solid var(--line);
  border-radius: 12px; padding: 13px 14px; width: 100%;
}
input[type=text]::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
input[type=text]:focus-visible { outline: none; border-color: var(--note); box-shadow: 0 0 0 3px color-mix(in srgb, var(--note) 30%, transparent); }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); min-height: 48px; transition: transform .08s ease, filter .15s;
}
button:active { transform: scale(.97); }
button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
button.note-btn { background: var(--note); color: var(--note-ink); }
button.link { background: none; color: var(--muted); padding: 4px 0; min-height: 0; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
button.wide { width: 100%; }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, .me:focus-visible { outline: 3px solid var(--note); outline-offset: 2px; }

/* hero note */
.note-wrap { display: flex; justify-content: center; padding: 10px 0 4px; }
.note {
  width: min(290px, 100%); aspect-ratio: 1 / .8; max-width: 100%;
  background: linear-gradient(180deg, var(--note) 0%, var(--note) 80%, var(--note-shade) 100%);
  color: var(--note-ink); transform: rotate(-2.5deg); border-radius: 2px;
  box-shadow: 0 22px 30px -18px rgba(0,0,0,.7), 0 2px 0 rgba(0,0,0,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 20px; text-align: center; position: relative;
}
.note::before { content: ""; position: absolute; top: -11px; left: 50%; width: 92px; height: 24px; transform: translateX(-50%) rotate(3deg); background: rgba(255,255,255,.35); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.note .who { font-family: var(--f-display); font-size: clamp(1.7rem, 8vw, 2.4rem); line-height: 1.08; overflow-wrap: anywhere; }
.note .q { font-family: var(--f-display); font-size: 5rem; line-height: .9; }
.note .cap { font-size: .92rem; opacity: .78; }

/* lobby seats */
.seats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seat { background: var(--card-2); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.seat .nm { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .tag { font-size: .75rem; color: var(--muted); }
.seat.empty { background: transparent; border: 2px dashed var(--line); }
.seat.empty .ring { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--line); }
@media (prefers-reduced-motion: no-preference) { .seat.empty .ring { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }
.invite { display: flex; gap: 8px; align-items: center; background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; min-width: 0; }
.invite code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.invite button { min-height: 38px; padding: 8px 12px; font-size: .9rem; }

/* rotation strip */
.strip { display: flex; gap: 10px; align-items: stretch; overflow-x: auto; padding-bottom: 2px; }
.who-card { flex: 1 1 0; min-width: 92px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.who-card.g { border-color: var(--note); background: color-mix(in srgb, var(--note) 12%, var(--card)); }
.who-card .nm { font-weight: 700; font-size: .92rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.who-card.g .role { color: var(--note); }
.roundline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--muted); }
.dots i.now { background: var(--note); }

/* questions */
.ask-now { font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yesno button { font-size: 1.3rem; min-height: 68px; border-radius: 16px; }
button.yes { background: var(--yes); color: var(--yes-ink); }
button.no { background: var(--no); color: var(--no-ink); }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.qlist li { display: grid; grid-template-columns: 2em 1fr; gap: 4px 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.qlist li:first-child { border-top: 0; padding-top: 2px; }
.qn { font-family: var(--f-mono); color: var(--muted); font-size: .82rem; padding-top: 2px; font-variant-numeric: tabular-nums; }
.qt { min-width: 0; overflow-wrap: anywhere; }
.ans { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--felt); color: var(--muted); }
.pill.y { background: color-mix(in srgb, var(--yes) 22%, transparent); color: var(--yes); }
.pill.n { background: color-mix(in srgb, var(--no) 22%, transparent); color: var(--no); }
.meter { display: flex; gap: 3px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.used { background: var(--note); }
.counter { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.guess { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.guess:first-child { border-top: 0; }
.guess .gt { min-width: 0; overflow-wrap: anywhere; text-decoration: line-through; color: var(--muted); }
.guess button { min-height: 38px; padding: 6px 12px; font-size: .88rem; }
.ok { color: var(--yes); font-weight: 700; }
.bad { color: var(--no); font-weight: 700; }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; }
.ideas button { background: var(--felt); color: var(--ink); border: 1px solid var(--line); font-weight: 400; min-height: 36px; padding: 6px 11px; font-size: .9rem; border-radius: 999px; }
.waiting { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.typing { display: inline-flex; gap: 3px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .typing i { animation: bob 1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .note { animation: drop .4s cubic-bezier(.2,.9,.3,1.2) both; }
}
@keyframes bob { 50% { transform: translateY(-4px); opacity: .5; } }
@keyframes drop { from { transform: rotate(-9deg) translateY(-14px) scale(.96); opacity: .4; } to { transform: rotate(-2.5deg); opacity: 1; } }

/* scores */
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th, table.score td { text-align: left; padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
table.score th { font-size: .75rem; color: var(--muted); font-weight: 400; border-top: 0; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
table.score td.nm { overflow-wrap: anywhere; }
.pn { display: flex; align-items: center; gap: 8px; min-width: 0; }
.big { font-family: var(--f-display); font-size: 2rem; line-height: 1.1; overflow-wrap: anywhere; color: var(--note); }
.notice { border-color: var(--accent); }

/* team chat (inline and in the sheet) */
.chat { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.msgs { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; overscroll-behavior: contain; }
.sheet .msgs { max-height: none; flex: 1; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
.bub { background: var(--card-2); padding: 8px 12px; border-radius: 16px 16px 16px 4px; overflow-wrap: anywhere; min-width: 0; }
.msg.mine .bub { background: var(--accent); color: var(--accent-ink); border-radius: 16px 16px 4px 16px; }
.team .msg.mine .bub { background: var(--team); color: #1b0d3a; }
.bub .by { display: block; font-size: .72rem; font-weight: 700; opacity: .75; }
.sys { align-self: center; font-size: .8rem; color: var(--muted); background: var(--felt); padding: 3px 10px; border-radius: 999px; text-align: center; }
.empty-chat { color: var(--muted); font-size: .9rem; text-align: center; padding: 14px 4px; }
.secret-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--team); font-weight: 700; }

/* chat button + sheet */
.fab {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 50%; padding: 0; display: grid; place-items: center;
  background: var(--note); color: var(--note-ink); box-shadow: 0 10px 24px rgba(0,0,0,.45); z-index: 20;
}
.fab svg { width: 28px; height: 28px; }
.badge { position: absolute; top: -2px; right: -2px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--no); color: #fff; font-size: .75rem; display: grid; place-items: center; border: 2px solid var(--felt); }
.scrim { position: fixed; inset: 0; background: rgba(6,8,24,.6); z-index: 30; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; height: min(78dvh, 640px);
  background: var(--card); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet > * { width: 100%; max-width: 520px; margin-left: auto; margin-right: auto; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.tabs { display: flex; gap: 6px; background: var(--felt); border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; min-height: 40px; background: transparent; color: var(--muted); border-radius: 9px; font-size: .92rem; padding: 6px 8px; position: relative; }
.tabs button[aria-selected="true"] { background: var(--card-2); color: var(--ink); }
.tabs .dotn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--no); margin-left: 6px; vertical-align: middle; }
.sheet .chat { flex: 1; min-height: 0; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; }
.composer button { padding: 10px 16px; }

/* toasts */
.toasts { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 40; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--felt); font-weight: 700; font-size: .92rem; padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.4); display: flex; align-items: center; gap: 8px; max-width: 100%; }
.toast .av { width: 22px; height: 22px; font-size: .7rem; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: tin .25s ease-out both; } }
@keyframes tin { from { transform: translateY(-12px); opacity: 0; } }
.foot { color: var(--muted); font-size: .82rem; text-align: center; }
.hero-title { font-family: var(--f-display); font-size: clamp(2.2rem, 11vw, 3rem); line-height: 1; margin: 6px 0 0; text-wrap: balance; }
.hero-title span { color: var(--note); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; color: var(--muted); }
.steps li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--card-2); color: var(--ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }

/* simultaneous board: everyone's forehead at once */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; position: relative; }
.pcard.turn { border-color: var(--note); box-shadow: 0 0 0 2px color-mix(in srgb, var(--note) 35%, transparent); }
.pcard .nm { font-weight: 700; font-size: .9rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .role { min-height: 1em; }
.pcard.turn .role { color: var(--note); }
.mnote { width: 100%; min-height: 58px; background: var(--note); color: var(--note-ink); border-radius: 2px; transform: rotate(-2deg); display: grid; place-items: center; padding: 6px; font-family: var(--f-display); font-size: .98rem; line-height: 1.1; overflow-wrap: anywhere; box-shadow: 0 8px 12px -8px rgba(0,0,0,.6); }
.pcard:nth-child(2n) .mnote { transform: rotate(1.8deg); }
.mnote.mine { font-size: 2rem; }
.mnote.solved { background: var(--yes); color: var(--yes-ink); }
.mnote.blank { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-family: var(--f-body); font-size: .8rem; transform: none; box-shadow: none; }
.pickcard { display: flex; flex-direction: column; gap: 12px; }
.pickhead { display: flex; align-items: center; gap: 10px; }
.locked { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--felt); border-radius: 12px; padding: 10px 12px; }
.locked .big-sm { font-family: var(--f-display); font-size: 1.3rem; color: var(--note); overflow-wrap: anywhere; min-width: 0; }
.turnbanner { display: flex; align-items: center; gap: 12px; }
.turnbanner h2 { flex: 1; min-width: 0; }
.res { font-weight: 700; font-size: .8rem; padding: 2px 9px; border-radius: 999px; }
.res.y { background: color-mix(in srgb, var(--yes) 22%, transparent); color: var(--yes); }
.res.n { background: color-mix(in srgb, var(--no) 22%, transparent); color: var(--no); }
.log li .who-l { font-size: .78rem; color: var(--muted); }
details.more summary { cursor: pointer; color: var(--muted); font-size: .9rem; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }

.msg, .sys, .empty-chat { flex-shrink: 0; }
.sheet .msgs { min-height: 0; }
.sheet .chat { display: flex; flex-direction: column; overflow: hidden; }
</style>
</head>
<body>
<div id="app"><div class="top"><span class="brand"><i class="mini"></i>Who's On My Forehead</span></div><div class="panel"><p>Loading the game…</p></div></div>
<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
(() => {
  "use strict";
  const MAXP = 5, MAXCHAT = 80, VER = 2;
  const COLORS = ["#ff9f7a", "#5ee0c1", "#c3a3ff", "#ffd166", "#7cc8ff"];
  const IDEAS = ["Taylor Swift","Lionel Messi","Cristiano Ronaldo","Albert Einstein","Barack Obama","Elon Musk","Shah Rukh Khan","Beyoncé","Michael Jackson","Leonardo DiCaprio","Queen Elizabeth II","Mahatma Gandhi","Nelson Mandela","Virat Kohli","Serena Williams","Steve Jobs","Marie Curie","Usain Bolt","Rihanna","Oprah Winfrey","Kumar Sangakkara","Muttiah Muralitharan","Sanath Jayasuriya","A. R. Rahman","Jackie Chan","Lady Gaga","Charlie Chaplin","Freddie Mercury","Mark Zuckerberg","Kim Kardashian","Pope Francis","Bob Marley","Dwayne Johnson","Adele","MrBeast","Lewis Hamilton","Shakira","Bruce Lee","Neymar","Billie Eilish"];

  // ---------- per-device storage ----------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");

  const me = { pid: LS.get("fh.pid", null) || rid(), name: LS.get("fh.name", "") };
  LS.set("fh.pid", me.pid);
  let hosted = LS.get("fh.hosted", null);
  if (hosted && (Date.now() - (hosted.t || 0) > 12 * 3600e3 || hosted.ver !== VER)) { hosted = null; LS.set("fh.hosted", null); }
  let ended = null;
  let myGid = LS.get("fh.gid", null);
  let myGidHost = LS.get("fh.gidHost", "");
  let acts = LS.get("fh.acts", []);
  let room, peers = [];
  let connected = false;
  const ui = { ideaFor: null, ideaPick: [], giveArmed: false, armed: null, sheet: false, tab: "a", editingName: false };
  let readUpTo = LS.get("fh.read", {});
  let lastSeen = {};

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clean = (s, n) => String(s ?? "").replace(/[\u0000-\u001f\u007f​-‏‪-‮⁠-⁤﻿]/g, "").replace(/\s+/g, " ").trim().slice(0, n);
  const secKey = (g, pid) => g.id + ":s:" + pid;
  const chatKey = (g, pid) => g.id + ":t:" + pid;
  function obf(s, k) { return [...s].map((c, i) => (c.codePointAt(0) ^ (k.charCodeAt(i % k.length) * 7)).toString(36)).join("."); }
  function deobf(o, k) { try { return o.split(".").map((x, i) => String.fromCodePoint(parseInt(x, 36) ^ (k.charCodeAt(i % k.length) * 7))).join(""); } catch { return ""; } }
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, " ").replace(/\s+/g, " ").trim().replace(/^the /, "");
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    const d = Array.from({ length: m + 1 }, (_, i) => [i].concat(Array(n).fill(0)));
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[m][n];
  }
  function matches(guess, secret) {
    const g = norm(guess), s = norm(secret);
    if (!g || !s) return false;
    if (g === s || g.replace(/ /g, "") === s.replace(/ /g, "")) return true;
    const tol = s.length >= 10 ? 2 : s.length >= 5 ? 1 : 0;
    if (lev(g, s) <= tol) return true;
    const parts = s.split(" "), last = parts[parts.length - 1];
    if (parts.length > 1 && last.length >= 4 && lev(g, last) <= (last.length >= 7 ? 1 : 0)) return true;
    return false;
  }
  const player = (g, pid) => g.players.find(p => p.pid === pid);
  const nameOf = (g, pid) => (player(g, pid) || {}).name || "Someone";
  const colorOf = (g, pid) => COLORS[Math.max(0, g.players.findIndex(p => p.pid === pid)) % COLORS.length];
  const initials = n => (String(n).trim().split(/\s+/).map(w => [...w][0] || "").join("").slice(0, 2) || "?").toUpperCase();
  const onlinePids = () => new Set(peers.map(p => p.presence && p.presence.pid).filter(Boolean).concat(connected ? [me.pid] : []));
  const online = pid => onlinePids().has(pid);
  const others = (g, pid) => g.players.filter(p => p.pid !== pid);
  const listNames = arr => arr.length <= 1 ? (arr[0] || "") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
  const secretOf = (g, pid) => g.sec[pid] ? deobf(g.sec[pid].x, secKey(g, pid)) : "";
  const isDone = (g, pid) => g.fin.some(f => f.pid === pid);
  const finOf = (g, pid) => g.fin.find(f => f.pid === pid);
  const av = (g, pid, cls = "", withStatus = true) => {
    const on = online(pid);
    return `<span class="av ${cls} ${withStatus ? (on ? "on" : "away") : ""}" style="--c:${colorOf(g, pid)}" aria-hidden="true">${esc(initials(nameOf(g, pid)))}${withStatus ? '<i class="st"></i>' : ""}</span>`;
  };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  function toast(html) {
    const box = document.getElementById("toasts");
    const el = document.createElement("div"); el.className = "toast"; el.innerHTML = html;
    box.appendChild(el); while (box.children.length > 2) box.firstChild.remove();
    setTimeout(() => el.remove(), 3200);
  }

  // ---------- game rules (run only on the host's phone) ----------
  // phases: lobby -> pick (every pair picks for the third, all at once) -> play (take turns) -> done
  function newGame() {
    return { ver: VER, id: rid(8), host: me.pid, v: 0, t: Date.now(), players: [{ pid: me.pid, name: me.name }], phase: "lobby", sec: {}, turn: null, qa: [], gs: [], fin: [], seen: {}, chat: [], n: 0 };
  }
  function sys(g, text, loud) { g.n++; g.chat.push({ i: g.n, k: "s", x: text, ts: Date.now(), ...(loud ? { l: 1 } : {}) }); g.chat = g.chat.slice(-MAXCHAT); }
  const active = g => g.players.filter(p => !isDone(g, p.pid));
  function nextTurn(g) {
    const order = g.players.map(p => p.pid);
    const start = order.indexOf(g.turn);
    for (let k = 1; k <= order.length; k++) {
      const pid = order[(start + k) % order.length];
      if (!isDone(g, pid)) { g.turn = pid; return; }
    }
    g.turn = null;
  }
  function checkEnd(g) {
    if (!active(g).length) { g.phase = "done"; g.turn = null; sys(g, "Everyone's done. Final scores are in.", 1); return true; }
    return false;
  }
  function finishPlayer(g, pid, ok) {
    const n = secretOf(g, pid);
    g.fin.push({ pid, ok, n, q: g.qa.filter(x => x.p === pid).length, g: g.gs.filter(x => x.p === pid).length });
    sys(g, ok ? `${nameOf(g, pid)} got it: ${n}!` : `${nameOf(g, pid)} gave up. They were ${n}.`, 1);
  }
  function resolveQuestion(g) {
    // a question is settled once everyone else who is here has answered
    const q = g.qa[g.qa.length - 1];
    if (!q || q.res) return false;
    const on = onlinePids();
    const need = others(g, q.p).filter(p => on.has(p.pid) || p.pid === g.host);
    const got = Object.keys(q.a);
    if (!got.length || need.some(p => !q.a[p.pid])) return false;
    q.res = Object.values(q.a).every(v => v === "y") ? "y" : "n";
    if (q.res === "n") { nextTurn(g); sys(g, `No. ${nameOf(g, g.turn)}'s turn.`); }
    return true;
  }
  function apply(g, pid, a) {
    const inGame = !!player(g, pid);
    switch (a.t) {
      case "join": {
        const nm = clean(a.name, 20) || "Player";
        const p = player(g, pid);
        if (p) { if (p.name !== nm) { sys(g, `${p.name} is now ${nm}`); p.name = nm; } return true; }
        if ((g.kicked || []).includes(pid)) return false;
        if (g.phase === "lobby" && g.players.length < MAXP) { g.players.push({ pid, name: nm }); sys(g, `${nm} joined`, 1); return true; }
        return false;
      }
      case "quit":
        if (!inGame || pid === g.host || g.phase !== "lobby") return false;
        sys(g, `${nameOf(g, pid)} left`, 1);
        g.players = g.players.filter(p => p.pid !== pid); return true;
      case "start":
        if (pid === g.host && g.phase === "lobby" && g.players.length >= 3) { g.phase = "pick"; g.sec = {}; g.qa = []; g.gs = []; g.fin = []; sys(g, "Pick a famous person for each friend. Use the secret chats."); return true; }
        return false;
      case "pick": {
        const nm = clean(a.name, 50);
        if (g.phase !== "pick" || !inGame || !nm || a.for === pid || !player(g, a.for)) return false;
        g.sec[a.for] = { x: obf(nm, secKey(g, a.for)), by: pid };
        sys(g, `A name is locked in for ${nameOf(g, a.for)}`);
        if (g.players.every(p => g.sec[p.pid])) { g.phase = "play"; g.turn = g.players[0].pid; sys(g, `Everyone has a name. ${nameOf(g, g.turn)} goes first.`, 1); }
        return true;
      }
      case "unpick":
        if (g.phase !== "pick" || !inGame || a.for === pid || !g.sec[a.for]) return false;
        delete g.sec[a.for]; return true;
      case "ask": {
        const q = clean(a.q, 100);
        const last = g.qa[g.qa.length - 1];
        if (g.phase === "play" && pid === g.turn && q && (!last || last.res)) { g.qa.push({ p: pid, q, a: {}, res: null }); return true; }
        return false;
      }
      case "answer": {
        const q = g.qa[a.i];
        if (g.phase === "play" && inGame && q && !q.res && q.p !== pid && (a.v === "y" || a.v === "n")) { q.a[pid] = a.v; resolveQuestion(g); return true; }
        return false;
      }
      case "guess": {
        const t = clean(a.text, 50);
        const last = g.qa[g.qa.length - 1];
        if (g.phase !== "play" || pid !== g.turn || !t || (last && !last.res)) return false;
        const ok = matches(t, secretOf(g, pid));
        g.gs.push({ p: pid, t, ok });
        if (ok) { finishPlayer(g, pid, true); if (!checkEnd(g)) { nextTurn(g); sys(g, `${nameOf(g, g.turn)}'s turn.`); } }
        else { nextTurn(g); sys(g, `${nameOf(g, pid)} guessed “${t}”. Wrong! ${nameOf(g, g.turn)}'s turn.`, 1); }
        return true;
      }
      case "accept": {
        const x = g.gs[a.i];
        if (g.phase !== "play" || !inGame || !x || x.ok || x.p === pid || isDone(g, x.p)) return false;
        x.ok = true; finishPlayer(g, x.p, true);
        if (!checkEnd(g) && (g.turn === x.p || isDone(g, g.turn))) nextTurn(g);
        return true;
      }
      case "giveup":
        if (g.phase !== "play" || !inGame || isDone(g, pid)) return false;
        finishPlayer(g, pid, false);
        if (!checkEnd(g) && g.turn === pid) { nextTurn(g); sys(g, `${nameOf(g, g.turn)}'s turn.`); }
        return true;
      case "kick": {
        const who = a.who;
        if (pid !== g.host || who === g.host || !player(g, who)) return false;
        const nm = nameOf(g, who);
        if (g.phase === "play" && g.turn === who) nextTurn(g);
        g.players = g.players.filter(p => p.pid !== who);
        delete g.sec[who];
        g.fin = g.fin.filter(f => f.pid !== who);
        g.kicked = (g.kicked || []).concat([who]).slice(-20);
        const q = g.qa[g.qa.length - 1];
        if (q && !q.res && q.p === who) q.res = "n";
        if (q && q.a) delete q.a[who];
        sys(g, `${nm} was removed by the host`, 1);
        if (g.phase === "pick" && g.players.length && g.players.every(p => g.sec[p.pid])) { g.phase = "play"; g.turn = g.players[0].pid; sys(g, `Everyone has a name. ${nameOf(g, g.turn)} goes first.`, 1); }
        if (g.phase === "play") { if (g.turn === who || !player(g, g.turn)) nextTurn(g); resolveQuestion(g); checkEnd(g); }
        return true;
      }
      case "restart":
        if (pid !== g.host || g.phase === "lobby") return false;
        g.phase = "lobby"; g.sec = {}; g.qa = []; g.gs = []; g.fin = []; g.turn = null;
        sys(g, "The host restarted. Back in the lobby.", 1);
        return true;
      case "again":
        if (g.phase === "done" && inGame) { g.phase = "pick"; g.sec = {}; g.qa = []; g.gs = []; g.fin = []; g.turn = null; g.players.push(g.players.shift()); sys(g, "New game. Pick new names."); return true; }
        return false;
      case "chat": {
        const x = clean(a.x, 200);
        if (!x || !inGame) return false;
        if (a.k === "t") {
          // a secret chat about player a.about; that player can never post in it or read it
          if (a.about === pid || !player(g, a.about)) return false;
          g.n++; g.chat.push({ i: g.n, k: "t", about: a.about, p: pid, x: obf(x, chatKey(g, a.about)), ts: Date.now() });
        } else { g.n++; g.chat.push({ i: g.n, k: "a", p: pid, x, ts: Date.now() }); }
        g.chat = g.chat.slice(-MAXCHAT);
        return true;
      }
    }
    return false;
  }

  const offlineSince = {}; const announcedOff = {};
  function hostWatchPresence() {
    if (!hosted || !connected) return false;
    const on = onlinePids(); let changed = false; const now = Date.now();
    for (const p of hosted.players) {
      if (p.pid === me.pid) continue;
      if (on.has(p.pid)) {
        delete offlineSince[p.pid];
        if (announcedOff[p.pid]) { delete announcedOff[p.pid]; sys(hosted, `${p.name} is back`, 1); changed = true; }
      } else {
        offlineSince[p.pid] = offlineSince[p.pid] || now;
        if (!announcedOff[p.pid] && now - offlineSince[p.pid] > 20000) { announcedOff[p.pid] = true; sys(hosted, `${p.name} went away`, 1); changed = true; }
      }
    }
    if (hosted.phase === "play" && resolveQuestion(hosted)) changed = true;
    return changed;
  }

  // ---------- networking: realtime presence ----------
  function myPresence() { return { pid: me.pid, name: me.name, g: hosted || ended || null, acts: hosted ? [] : acts }; }
  function pushPresence() { if (room) Promise.resolve(room.presence(myPresence())).catch(() => {}); }
  function commit() { hosted.v++; hosted.t = Date.now(); LS.set("fh.hosted", hosted); pushPresence(); render(); }
  function send(a) {
    if (hosted) { if (apply(hosted, me.pid, a)) commit(); return; }
    if (!myGid) return;
    const last = acts.length ? acts[acts.length - 1].s : 0;
    acts = acts.concat([{ ...a, gid: myGid, s: Math.max(last + 1, Date.now()) }]).slice(-10);
    LS.set("fh.acts", acts);
    pushPresence(); render();
  }
  function hostProcess() {
    if (!hosted) return;
    let changed = false;
    for (const p of peers) {
      const pr = p.presence || {};
      if (!pr.pid || pr.pid === me.pid || !Array.isArray(pr.acts)) continue;
      for (const a of pr.acts) {
        if (!a || a.gid !== hosted.id || typeof a.s !== "number") continue;
        if (a.s <= (hosted.seen[pr.pid] || 0)) continue;
        hosted.seen[pr.pid] = a.s;
        apply(hosted, pr.pid, a); changed = true;
      }
    }
    if (hostWatchPresence()) changed = true;
    if (changed) commit();
  }
  function hostGames() {
    const out = [];
    for (const p of peers) {
      const pr = p.presence || {};
      if (pr.pid && pr.pid !== me.pid && pr.g && pr.g.id && Array.isArray(pr.g.players) && (pr.g.ended || pr.g.ver === VER)) out.push({ hostName: clean(pr.name, 20) || "Someone", g: pr.g });
    }
    return out;
  }
  function currentGame() {
    if (hosted) return hosted;
    if (myGid) { const f = hostGames().find(x => x.g.id === myGid); if (f) return f.g; }
    return null;
  }

  // ---------- chats ----------
  // tab "a" = everyone; tab "t:<pid>" = secret chat about that player
  const inGameNow = g => g.phase !== "lobby" && !!player(g, me.pid);
  function tabsFor(g) { return inGameNow(g) ? ["a"].concat(others(g, me.pid).map(p => "t:" + p.pid)) : ["a"]; }
  function visibleChat(g, tab) {
    if (tab.startsWith("t:")) {
      const about = tab.slice(2);
      if (about === me.pid) return [];
      return g.chat.filter(m => m.k === "t" && m.about === about).map(m => ({ ...m, x: deobf(m.x, chatKey(g, about)) }));
    }
    return g.chat.filter(m => m.k === "a" || m.k === "s");
  }
  const unread = (g, tab) => visibleChat(g, tab).filter(m => m.i > (readUpTo[g.id + tab] || 0) && m.p !== me.pid && m.k !== "s").length;
  function markRead(g, tab) {
    const list = visibleChat(g, tab); const top = list.length ? list[list.length - 1].i : 0;
    if ((readUpTo[g.id + tab] || 0) < top) { readUpTo[g.id + tab] = top; LS.set("fh.read", readUpTo); }
  }
  function chatHtml(g, tab, inputId) {
    const list = visibleChat(g, tab);
    const team = tab.startsWith("t:");
    const about = team ? tab.slice(2) : null;
    const mates = team ? others(g, about).filter(p => p.pid !== me.pid).map(p => p.name) : [];
    const msgs = list.length ? list.map(m => m.k === "s" ? `<div class="sys">${esc(m.x)}</div>` :
      `<div class="msg ${m.p === me.pid ? "mine" : ""}">${m.p === me.pid ? "" : av(g, m.p, "sm", false)}<div class="bub">${m.p === me.pid ? "" : `<span class="by">${esc(nameOf(g, m.p))}</span>`}${esc(m.x)}</div></div>`).join("")
      : `<div class="empty-chat">${team ? `Only you and ${esc(listNames(mates))} see this. ${esc(nameOf(g, about))} can't.` : "Say hi. Everyone can see this chat."}</div>`;
    return `<div class="chat ${team ? "team" : ""}"><div class="msgs" data-scroll="${inputId}">${msgs}</div>
      <div class="composer"><input type="text" id="${inputId}" maxlength="200" placeholder="${team ? `Talk about ${esc(nameOf(g, about))}…` : "Message everyone"}" autocomplete="off" enterkeyhint="send" data-enter="chat" data-k="${team ? "t" : "a"}" data-about="${esc(about || "")}"><button data-act="chat" data-for="${inputId}" data-k="${team ? "t" : "a"}" data-about="${esc(about || "")}" aria-label="Send">Send</button></div></div>`;
  }

  // ---------- UI actions ----------
  const val = id => (document.getElementById(id) || {}).value || "";
  const clearVal = id => { const el = document.getElementById(id); if (el) el.value = ""; };
  const shareUrl = () => location.href.split("#")[0].split("?")[0];
  const handlers = {
    saveName() {
      const n = clean(val("nm"), 20); if (!n) return;
      me.name = n; LS.set("fh.name", n); ui.editingName = false;
      if (hosted) { const p = player(hosted, me.pid); if (p && p.name !== n) { sys(hosted, `${p.name} is now ${n}`); p.name = n; } commit(); }
      else { if (myGid) send({ t: "join", name: n }); else { pushPresence(); render(); } }
    },
    rename() { ui.editingName = true; render(); },
    cancelRename() { ui.editingName = false; render(); },
    host() { myGid = null; LS.set("fh.gid", null); ended = null; hosted = newGame(); sys(hosted, `${me.name} opened the game`); commit(); },
    join(el) { myGid = el.dataset.gid; myGidHost = el.dataset.host || ""; LS.set("fh.gid", myGid); LS.set("fh.gidHost", myGidHost); send({ t: "join", name: me.name }); },
    leave() {
      if (hosted) { ended = { id: hosted.id, ended: true, players: [], phase: "ended" }; hosted = null; LS.set("fh.hosted", null); }
      else if (myGid) send({ t: "quit" });
      myGid = null; LS.set("fh.gid", null); ui.sheet = false; pushPresence(); render();
    },
    start() { send({ t: "start" }); },
    pick(el) { const f = el.dataset.for, id = "pk-" + f; const n = clean(val(id), 50); if (!n) return; ui.ideaFor = null; send({ t: "pick", for: f, name: n }); clearVal(id); },
    unpick(el) { send({ t: "unpick", for: el.dataset.for }); },
    ideas(el) { const f = el.dataset.for; ui.ideaFor = ui.ideaFor === f ? null : f; ui.ideaPick = [...IDEAS].sort(() => Math.random() - .5).slice(0, 8); render(); },
    idea(el) { const i = document.getElementById("pk-" + el.dataset.for); if (i) { i.value = el.dataset.n; i.focus(); } },
    ask() { const q = clean(val("qq"), 100); if (!q) return; send({ t: "ask", q }); clearVal("qq"); },
    yes(el) { buzz(15); send({ t: "answer", i: +el.dataset.i, v: "y" }); },
    no(el) { buzz(15); send({ t: "answer", i: +el.dataset.i, v: "n" }); },
    guess() { const t = clean(val("gg"), 50); if (!t) return; send({ t: "guess", text: t }); clearVal("gg"); },
    accept(el) { send({ t: "accept", i: +el.dataset.i }); },
    giveup() {
      if (!ui.giveArmed) { ui.giveArmed = true; render(); setTimeout(() => { ui.giveArmed = false; render(); }, 4000); return; }
      ui.giveArmed = false; send({ t: "giveup" });
    },
    again() { send({ t: "again" }); },
    arm(el) {
      const k = el.dataset.key;
      if (ui.armed !== k) { ui.armed = k; render(); clearTimeout(ui.armT); ui.armT = setTimeout(() => { ui.armed = null; render(); }, 4000); return; }
      ui.armed = null;
      if (k === "end") handlers.leave();
      else if (k === "restart") send({ t: "restart" });
      else if (k.startsWith("kick:")) send({ t: "kick", who: k.slice(5) });
    },
    chat(el) {
      const id = el.dataset.for || el.id; const x = clean(val(id), 200); if (!x) return;
      send({ t: "chat", k: el.dataset.k, about: el.dataset.about || undefined, x }); clearVal(id);
      const i = document.getElementById(id); if (i) i.focus();
    },
    openChat() { ui.sheet = true; const g = currentGame(); if (g && !tabsFor(g).includes(ui.tab)) ui.tab = "a"; render(); },
    closeChat() { ui.sheet = false; render(); },
    tab(el) { ui.tab = el.dataset.tab; render(); },
    copy(el) {
      const done = () => { el.textContent = "Copied"; setTimeout(() => { el.textContent = "Copy"; }, 1600); };
      try { navigator.clipboard.writeText(shareUrl()).then(done, () => selectInvite()); } catch { selectInvite(); }
    },
    share() { if (navigator.share) navigator.share({ title: "Who's On My Forehead", text: "Join my game", url: shareUrl() }).catch(() => {}); },
    reload() { location.reload(); }
  };
  function selectInvite() { const c = document.querySelector(".invite code"); if (!c) return; const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const f = handlers[b.dataset.act]; if (f) { e.preventDefault(); f(b); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && ui.sheet) { handlers.closeChat(); return; }
    if (e.key !== "Enter" || !e.target.matches("input[data-enter]")) return;
    e.preventDefault(); const f = handlers[e.target.dataset.enter]; if (f) f(e.target);
  });

  // ---------- views ----------
  const CHAT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`;
  const dotsWait = `<span class="typing"><i></i><i></i><i></i></span>`;
  function topBar() {
    return `<div class="top"><span class="brand"><i class="mini" aria-hidden="true"></i>Who's On My Forehead</span>${me.name ? `<button class="me" data-act="rename" title="Change your name"><span class="conn ${connected ? "" : "off"}" aria-label="${connected ? "Connected" : "Not connected"}"></span>${esc(me.name)}</button>` : ""}</div>`;
  }
  function nameForm(first) {
    return `<section class="panel"><label for="nm"><h2>${first ? "What should your friends call you?" : "Change your name"}</h2></label>
      <div class="row"><input type="text" id="nm" maxlength="20" autocomplete="nickname" placeholder="Your name" value="${first ? "" : esc(me.name)}" data-enter="saveName" enterkeyhint="done"><button class="note-btn" data-act="saveName">${first ? "Let's play" : "Save"}</button></div>
      ${first ? "" : `<button class="link" data-act="cancelRename">Cancel</button>`}</section>`;
  }
  function board(g) {
    return `<div class="board">${g.players.map(p => {
      const mine = p.pid === me.pid, f = finOf(g, p.pid);
      let note;
      if (f) note = `<div class="mnote ${f.ok ? "solved" : ""}">${esc(f.n)}</div>`;
      else if (mine) note = `<div class="mnote mine">?</div>`;
      else if (g.sec[p.pid]) note = `<div class="mnote">${esc(secretOf(g, p.pid))}</div>`;
      else note = `<div class="mnote blank">not picked yet</div>`;
      const role = f ? (f.ok ? "Solved" : "Gave up") : g.phase === "play" && g.turn === p.pid ? "Their turn" : "";
      return `<div class="pcard ${g.phase === "play" && g.turn === p.pid ? "turn" : ""}">${av(g, p.pid)}<span class="nm">${esc(p.name)}${mine ? " (you)" : ""}</span>${note}<span class="role">${mine && g.phase === "play" && g.turn === p.pid ? "Your turn" : role}</span></div>`;
    }).join("")}</div>`;
  }
  function myClues(g) {
    const mineQ = g.qa.filter(x => x.p === me.pid && x.res);
    const mineG = g.gs.filter(x => x.p === me.pid);
    if (!mineQ.length && !mineG.length) return `<p class="hint">Nothing yet. Start broad, like “Am I alive?” or “Am I a sports star?”</p>`;
    return `<ol class="qlist">${mineQ.map((x, i) => `<li><span class="qn">${i + 1}</span><span class="qt">${esc(x.q)}</span><span class="ans"><span class="res ${x.res}">${x.res === "y" ? "Yes" : "No"}</span>${Object.keys(x.a).length > 1 && new Set(Object.values(x.a)).size > 1 ? `<span class="hint">${others(g, me.pid).map(p => `${esc(p.name)}: ${x.a[p.pid] === "y" ? "yes" : x.a[p.pid] === "n" ? "no" : "-"}`).join(", ")}</span>` : ""}</span></li>`).reverse().join("")}</ol>
      ${mineG.length ? `<div>${mineG.map(x => `<div class="guess"><span class="gt">${esc(x.t)}</span><span class="bad">Wrong guess</span></div>`).join("")}</div>` : ""}`;
  }
  function fullLog(g) {
    const done = g.qa.filter(x => x.res);
    if (!done.length) return `<p class="hint">No questions yet.</p>`;
    return `<ol class="qlist log">${done.slice(-25).map(x => `<li><span class="qn">${av(g, x.p, "sm", false)}</span><span class="qt"><span class="who-l">${esc(nameOf(g, x.p))}${x.p === me.pid ? " (you)" : ` · is ${esc(secretOf(g, x.p) || (finOf(g, x.p) || {}).n || "")}`}</span><br>${esc(x.q)}</span><span class="ans"><span class="res ${x.res}">${x.res === "y" ? "Yes" : "No"}</span></span></li>`).reverse().join("")}</ol>`;
  }
  function scoreTable(g) {
    const ranked = [...g.fin].map((f, i) => ({ ...f, order: i })).sort((a, b) => (b.ok - a.ok) || (a.order - b.order));
    return `<div style="overflow-x:auto"><table class="score"><thead><tr><th>#</th><th>Player</th><th>Was</th><th>Questions</th></tr></thead><tbody>${ranked.map((r, i) => `<tr><td>${r.ok ? i + 1 : "–"}</td><td><span class="pn">${av(g, r.pid, "sm", false)}<span class="nm">${esc(nameOf(g, r.pid))}</span></span></td><td class="nm">${esc(r.n)}</td><td>${r.ok ? r.q : `<span class="bad">Gave up</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function view() {
    if (!me.name) {
      return topBar() + `<h1 class="hero-title">Who's on my <span>forehead?</span></h1>
        <ol class="steps"><li>Three friends open this link on their own phones.</li><li>Every pair secretly picks a famous person for the third, in private chats. Everyone gets a name at the same time.</li><li>You see everyone's name except your own. Take turns asking yes/no questions. A “No” or a wrong guess passes the turn. First to guess wins.</li></ol>` + nameForm(true);
    }
    if (ui.editingName) return topBar() + nameForm(false);
    if (room === undefined) return topBar() + `<section class="panel"><div class="waiting">${dotsWait}Connecting to the game…</div></section>`;
    if (room === null) return topBar() + `<section class="panel notice"><h2>Can't reach the game server</h2><p class="hint">Check that this phone is online, then reload.</p><div class="row"><button data-act="reload">Reload</button></div></section>`;

    const g = currentGame();
    if (!g && myGid) {
      return topBar() + `<section class="panel"><h2>${esc(myGidHost || "The host")} is away</h2><p class="hint">The game lives on the host's phone. When they open the link again, you're straight back in.</p><div class="waiting">${dotsWait}Waiting for them</div><div class="row"><button class="ghost" data-act="leave">Leave this game</button></div></section>`;
    }
    if (!g) {
      const open = hostGames().filter(x => !x.g.ended && !(x.g.kicked || []).includes(me.pid) && (x.g.phase === "lobby" || x.g.players.some(p => p.pid === me.pid)));
      return topBar() +
        (open.length ? `<section class="panel"><span class="eyebrow">Join a friend</span>${open.map(x => `<div class="row spread"><span class="pn"><span class="av" style="--c:${COLORS[0]}">${esc(initials(x.hostName))}</span><span><strong>${esc(x.hostName)}'s game</strong><br><span class="hint">${x.g.players.length} joined</span></span></span><button class="note-btn" data-act="join" data-gid="${esc(x.g.id)}" data-host="${esc(x.hostName)}">Join</button></div>`).join("")}</section>` : "") +
        `<section class="panel ${open.length ? "flat" : ""}"><h2>${open.length ? "Or host your own" : "Host a game"}</h2><p class="hint">One person hosts. The others open this same link, and the game appears on their screen with a Join button.</p><button class="${open.length ? "ghost" : "note-btn"} wide" data-act="host">Host a new game</button></section>` +
        (open.length ? "" : `<p class="foot">Friend already hosting? Their game shows up here by itself.</p>`);
    }
    if (g.ended) return topBar() + `<section class="panel"><h2>The host ended this game</h2><div class="row"><button data-act="leave">Back to start</button></div></section>`;

    const mine = !!player(g, me.pid);
    const isHost = g.host === me.pid;
    if (!mine) {
      if ((g.kicked || []).includes(me.pid)) return topBar() + `<section class="panel"><h2>The host removed you from this game</h2><div class="row"><button data-act="leave">Back to start</button></div></section>`;
      if (g.phase === "lobby") return topBar() + `<section class="panel"><div class="waiting">${dotsWait}Taking a seat at ${esc(myGidHost)}'s game…</div><button class="link" data-act="leave">Cancel</button></section>`;
      return topBar() + `<section class="panel"><h2>That game started without you</h2><p class="hint">Ask the host to start a new one after this game.</p><div class="row"><button class="ghost" data-act="leave">Back</button></div></section>`;
    }
    const hostAway = !isHost && !online(g.host);
    let body = "";

    if (g.phase === "lobby") {
      const n = g.players.length, seats = Math.max(3, n);
      body = `<section class="panel"><span class="eyebrow">${isHost ? "Your game" : `${esc(nameOf(g, g.host))}'s game`}</span>
        <h2>${n < 3 ? `Waiting for ${3 - n} more player${3 - n === 1 ? "" : "s"}` : "Everyone's here"}</h2>
        <div class="seats">${Array.from({ length: seats }, (_, i) => {
          const p = g.players[i];
          return p ? `<div class="seat">${av(g, p.pid, "lg")}<span class="nm">${esc(p.name)}</span><span class="tag">${p.pid === g.host ? "Host" : ""}${p.pid === me.pid ? (p.pid === g.host ? " · you" : "You") : ""}${!online(p.pid) ? " · away" : ""}</span></div>` : `<div class="seat empty"><span class="ring"></span><span class="tag">Open seat</span></div>`;
        }).join("")}</div>
        <span class="eyebrow">Invite</span>
        <div class="invite"><code>${esc(shareUrl())}</code><button class="ghost" data-act="copy">Copy</button>${navigator.share ? `<button class="ghost" data-act="share">Share</button>` : ""}</div>
        ${isHost ? `<button class="note-btn wide" data-act="start" ${n < 3 ? "disabled" : ""}>${n < 3 ? "Start when 3 have joined" : `Start with ${n} players`}</button>` : `<div class="waiting">${dotsWait}Waiting for ${esc(nameOf(g, g.host))} to start</div>`}
        <button class="link" data-act="leave">${isHost ? "Cancel game" : "Leave"}</button></section>`;
    } else if (g.phase === "pick") {
      const targets = others(g, me.pid);
      const left = g.players.filter(p => !g.sec[p.pid]).length;
      body = board(g) + `<section class="panel"><h2>Pick a famous person for each friend</h2><p class="hint">Each friend has a secret chat that they can't see. Agree with the others there, then lock it in. Play starts once all ${g.players.length} names are in (${g.players.length - left} done).</p></section>` +
        targets.map(t => {
          const mates = others(g, t.pid).filter(p => p.pid !== me.pid).map(p => p.name);
          const s = g.sec[t.pid];
          return `<section class="panel pickcard"><div class="pickhead">${av(g, t.pid)}<div><h2>Who should ${esc(t.name)} be?</h2><span class="secret-tag">● Secret from ${esc(t.name)} · with ${esc(listNames(mates))}</span></div></div>
            ${chatHtml(g, "t:" + t.pid, "tc-" + t.pid)}
            ${s ? `<div class="locked"><span><span class="eyebrow">Locked in by ${esc(nameOf(g, s.by))}</span><br><span class="big-sm">${esc(secretOf(g, t.pid))}</span></span><button class="ghost" data-act="unpick" data-for="${esc(t.pid)}">Change</button></div>`
              : `<div class="row"><input type="text" id="pk-${esc(t.pid)}" maxlength="50" placeholder="A famous person for ${esc(t.name)}" autocomplete="off" data-enter="pick" data-for="${esc(t.pid)}" enterkeyhint="done"><button class="note-btn" data-act="pick" data-for="${esc(t.pid)}">Lock in</button></div>
                 <button class="link" data-act="ideas" data-for="${esc(t.pid)}">${ui.ideaFor === t.pid ? "Hide ideas" : "Stuck? Show ideas"}</button>
                 ${ui.ideaFor === t.pid ? `<div class="ideas">${ui.ideaPick.map(n => `<button data-act="idea" data-for="${esc(t.pid)}" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}`}
          </section>`;
        }).join("") +
        (g.sec[me.pid] ? `<section class="panel flat"><p>Your friends have picked your name. No peeking!</p></section>` : `<section class="panel flat"><div class="waiting">${dotsWait}Your friends are choosing your name</div></section>`);
    } else if (g.phase === "play") {
      const last = g.qa[g.qa.length - 1];
      const pending = last && !last.res ? last : null;
      const myTurn = g.turn === me.pid, iDone = isDone(g, me.pid);
      let action;
      if (pending && pending.p === me.pid) {
        action = `<section class="panel"><span class="eyebrow">You asked</span><p class="ask-now">${esc(pending.q)}</p><div class="waiting">${dotsWait}Waiting for ${esc(listNames(others(g, me.pid).filter(p => !pending.a[p.pid]).map(p => p.name)))}</div></section>`;
      } else if (pending) {
        const answeredMe = pending.a[me.pid];
        action = `<section class="panel"><span class="eyebrow">${esc(nameOf(g, pending.p))} asks · they are <strong style="color:var(--note)">${esc(secretOf(g, pending.p))}</strong></span><p class="ask-now">${esc(pending.q)}</p>
          ${answeredMe ? `<div class="waiting">${dotsWait}You said ${answeredMe === "y" ? "Yes" : "No"}. Waiting for the others</div>` : `<div class="yesno"><button class="yes" data-act="yes" data-i="${g.qa.length - 1}">Yes</button><button class="no" data-act="no" data-i="${g.qa.length - 1}">No</button></div>`}</section>`;
      } else if (myTurn) {
        action = `<section class="panel"><div class="turnbanner">${av(g, me.pid, "lg")}<h2>Your turn. Ask a yes/no question.</h2></div>
          <p class="hint">Keep asking while they say Yes. A No passes the turn.</p>
          <div class="row"><input type="text" id="qq" maxlength="100" placeholder="Am I a sports star?" autocomplete="off" data-enter="ask" enterkeyhint="send"><button data-act="ask">Ask</button></div>
          <label for="gg" class="eyebrow">Or make a guess (a wrong guess passes the turn)</label>
          <div class="row"><input type="text" id="gg" maxlength="50" placeholder="I am…" autocomplete="off" data-enter="guess" enterkeyhint="go"><button class="note-btn" data-act="guess">Guess</button></div></section>`;
      } else {
        action = `<section class="panel"><div class="turnbanner">${av(g, g.turn, "lg")}<h2>${esc(nameOf(g, g.turn))}'s turn</h2></div><div class="waiting">${dotsWait}Waiting for their question</div></section>`;
      }
      const wrong = g.gs.map((x, i) => ({ ...x, i })).filter(x => !x.ok && x.p !== me.pid && !isDone(g, x.p)).slice(-3);
      body = board(g) + action +
        (wrong.length ? `<section class="panel"><span class="eyebrow">Recent wrong guesses</span><div>${wrong.map(x => `<div class="guess"><span class="gt">${esc(nameOf(g, x.p))}: ${esc(x.t)}</span><button class="ghost" data-act="accept" data-i="${x.i}">Count it as right</button></div>`).join("")}</div><p class="hint">Use this if they got it but spelled it differently.</p></section>` : "") +
        (iDone ? `<section class="panel flat"><p>You're done${finOf(g, me.pid).ok ? " and on the scoreboard" : ""}. Keep answering for the others.</p></section>` :
          `<section class="panel"><div class="row spread"><span class="eyebrow">Your clues</span><span class="counter">${g.qa.filter(x => x.p === me.pid).length} asked</span></div>${myClues(g)}<button class="link" data-act="giveup">${ui.giveArmed ? "Tap again to give up" : "Give up and reveal my name"}</button></section>`) +
        `<section class="panel"><details class="more"><summary>Everyone's questions</summary>${fullLog(g)}</details></section>`;
    } else if (g.phase === "done") {
      const winner = g.fin.find(f => f.ok);
      body = board(g) + `<section class="panel"><span class="eyebrow">Final</span>
        <p class="big">${winner ? `${esc(nameOf(g, winner.pid))} wins` : "Nobody cracked it"}</p>
        <p class="hint">Ranked by who guessed first.</p>${scoreTable(g)}
        <button class="note-btn wide" data-act="again">Play again</button><button class="link" data-act="leave">${isHost ? "End game" : "Leave"}</button></section>`;
    }
    if (isHost && g.phase !== "lobby") body += hostControls(g);
    else if (isHost && g.players.length > 1) body += hostControls(g);
    return topBar() + (hostAway ? `<section class="panel notice"><p><strong>${esc(nameOf(g, g.host))}</strong> (the host) dropped out. The game picks up when they open the link again.</p></section>` : "") + body;
  }

  function armBtn(key, label, sure, cls = "ghost", extra = "") {
    const on = ui.armed === key;
    return `<button class="${on ? "no" : cls}" data-act="arm" data-key="${esc(key)}" ${extra}>${on ? sure : label}</button>`;
  }
  function hostControls(g) {
    return `<section class="panel"><span class="eyebrow">Host controls</span>
      <div class="stack">${g.players.filter(p => p.pid !== me.pid).map(p => `<div class="row spread"><span class="pn">${av(g, p.pid, "sm")}<span>${esc(p.name)}${online(p.pid) ? "" : ' <span class="hint">· away</span>'}</span></span>${armBtn("kick:" + p.pid, "Remove", "Tap to confirm")}</div>`).join("")}</div>
      <div class="row">${g.phase !== "lobby" ? armBtn("restart", "Back to lobby", "Tap again to restart") : ""}${armBtn("end", "End game for everyone", "Tap again to end")}</div>
      <p class="hint">Removing someone takes their seat away. Back to lobby keeps everyone and clears the names.</p></section>`;
  }
  function layer(g) {
    if (!g || g.ended || !player(g, me.pid)) return "";
    const tabs = tabsFor(g);
    if (!tabs.includes(ui.tab)) ui.tab = "a";
    const inlineTeams = g.phase === "pick";
    const badge = tabs.reduce((s, t) => s + (inlineTeams && t !== "a" ? 0 : unread(g, t)), 0);
    let html = `<button class="fab" data-act="openChat" aria-label="Open chat">${CHAT_ICON}${badge ? `<span class="badge">${badge > 9 ? "9+" : badge}</span>` : ""}</button>`;
    if (ui.sheet) {
      html += `<div class="scrim" data-act="closeChat"></div><div class="sheet" role="dialog" aria-label="Chat"><div class="grab"></div>
        <div class="row spread"><h2>Chat</h2><button class="link" data-act="closeChat">Close</button></div>
        ${tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" data-act="tab" data-tab="${esc(t)}" aria-selected="${ui.tab === t}">${t === "a" ? "Everyone" : `About ${esc(nameOf(g, t.slice(2)))}`}${unread(g, t) ? '<span class="dotn"></span>' : ""}</button>`).join("")}</div>` : ""}
        ${ui.tab !== "a" ? `<span class="secret-tag">● ${esc(nameOf(g, ui.tab.slice(2)))} can't see this</span>` : ""}
        ${chatHtml(g, ui.tab, "sheet-" + ui.tab.replace(":", "-"))}</div>`;
    }
    return html;
  }

  function noticeChanges(g) {
    if (!g || g.ended) return;
    if (lastSeen.gid === g.id) {
      for (const m of g.chat) {
        if (m.i <= (lastSeen.chatTop || 0)) continue;
        if (m.k === "s") { if (m.l) toast(esc(m.x)); }
        else if (m.p !== me.pid && !ui.sheet) {
          if (m.k === "a") toast(`${av(g, m.p, "", false)}${esc(nameOf(g, m.p))}: ${esc(m.x.slice(0, 40))}`);
          else if (m.about !== me.pid && g.phase !== "pick") toast(`${av(g, m.p, "", false)}About ${esc(nameOf(g, m.about))}: ${esc(deobf(m.x, chatKey(g, m.about)).slice(0, 40))}`);
        }
      }
      const last = g.qa[g.qa.length - 1];
      if (g.phase === "play" && last && g.qa.length > (lastSeen.qn || 0) && last.p !== me.pid) buzz([40, 60, 40]);
      if (g.phase === "play" && g.turn === me.pid && lastSeen.turn !== me.pid) buzz(120);
    }
    lastSeen = { gid: g.id, qn: g.qa.length, turn: g.turn, chatTop: g.chat.length ? g.chat[g.chat.length - 1].i : 0 };
  }

  function render() {
    const app = document.getElementById("app"), lay = document.getElementById("layer");
    const saved = {};
    document.querySelectorAll("input[id]").forEach(i => (saved[i.id] = i.value));
    const f = document.activeElement && document.activeElement.id;
    const sel = f && document.activeElement.selectionStart;
    const stuck = {};
    document.querySelectorAll(".msgs[data-scroll]").forEach(m => (stuck[m.dataset.scroll] = m.scrollHeight - m.scrollTop - m.clientHeight < 40 ? -1 : m.scrollTop));
    const openDetails = [...document.querySelectorAll("details.more")].map(d => d.open);
    const g = currentGame();
    noticeChanges(g);
    app.innerHTML = view();
    lay.innerHTML = layer(g);
    document.querySelectorAll("details.more").forEach((d, i) => { if (openDetails[i]) d.open = true; });
    if (g && ui.sheet) markRead(g, ui.tab);
    if (g && g.phase === "pick") others(g, me.pid).forEach(p => markRead(g, "t:" + p.pid));
    for (const [id, v] of Object.entries(saved)) { const el = document.getElementById(id); if (el && v && id !== "nm") el.value = v; }
    document.querySelectorAll(".msgs[data-scroll]").forEach(m => { const s = stuck[m.dataset.scroll]; m.scrollTop = s === undefined || s === -1 ? m.scrollHeight : s; });
    if (f) { const el = document.getElementById(f); if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(sel, sel); } catch {} } }
  }

  // ---------- connection (Supabase Realtime presence) ----------
  const SB_URL = "https://qqlusijewdmwtgwlbktn.supabase.co";
  const SB_KEY = "sb_publishable_0x_6DNCbL_Kczf3Tu4yQJg_YuZnYqhD";
  const CHANNEL = "forehead-lobby-v1";
  function onSync(list) { peers = list; hostProcess(); render(); }
  let sb = null, ch = null, joinTimer = null;
  function openChannel() {
    if (ch) { try { sb.removeChannel(ch); } catch {} }
    ch = sb.channel(CHANNEL, { config: { presence: { key: me.pid + "-" + rid(4) } } });
    const mine = ch;
    ch.on("presence", { event: "sync" }, () => {
      if (mine !== ch) return;
      const st = ch.presenceState();
      onSync(Object.values(st).map(arr => ({ presence: arr[arr.length - 1] || {} })));
    });
    ch.subscribe(status => {
      if (mine !== ch) return;
      if (status === "SUBSCRIBED") { clearTimeout(joinTimer); connected = true; room = { presence: o => mine.track(o) }; pushPresence(); render(); }
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") { connected = false; render(); }
    });
  }
  function connect() {
    if (window.__FH_MOCK) {
      window.__FH_MOCK(me.pid, onSync).then(r => { room = r; connected = true; pushPresence(); render(); });
      return;
    }
    if (!window.supabase || !window.supabase.createClient) { room = null; render(); return; }
    // worker: keeps the connection's heartbeat going while this tab is in the background
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false }, realtime: { worker: true, heartbeatIntervalMs: 15000, params: { eventsPerSecond: 10 } } });
    joinTimer = setTimeout(() => { if (room === undefined) { room = null; render(); } }, 15000);
    openChannel();
    // coming back to the page (phone unlocked, tab switched back): rejoin at once if the line dropped
    const revive = () => {
      if (document.hidden || !ch) return;
      if (ch.state !== "joined") { connected = false; render(); openChannel(); }
      else pushPresence();
    };
    document.addEventListener("visibilitychange", revive);
    window.addEventListener("focus", revive);
    window.addEventListener("online", revive);
    setInterval(() => { if (ch && !document.hidden && ch.state !== "joined" && ch.state !== "joining") openChannel(); }, 10000);
  }
  setInterval(() => { if (hosted && hostWatchPresence()) commit(); }, 3000);
  render();
  connect();
})();
</script>
</body>
</html>
